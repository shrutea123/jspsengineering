<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JSPS Engineering & Solutions Pte. Ltd.</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script redirects a 404 (from a deep link / refresh) to the
      // root index.html, encoding the intended path in the query string
      // so index.html's script can restore it via history.replaceState.
      var pathSegmentsToKeep = 0; // custom domain serves from root, no repo subpath to keep

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
